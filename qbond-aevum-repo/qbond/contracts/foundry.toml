[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[rpc_endpoints]
aevum = "${AEVUM_RPC_URL}"

[etherscan]
aevum = { key = "${EXPLORER_API_KEY}", chain = 44005, url = "https://explorer-test.qday.info/api" }
